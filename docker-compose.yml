# Production deploy via prebuilt multi-arch image from GHCR.
# Image is built by .github/workflows/build.yml on push to main.
#
# Local setup:
#   cp .env.example .env
#   # edit .env with your PRIVATE_ENCRYPTION_KEY and ORIGIN
#   docker compose pull
#   docker compose up -d
#
# To build the image locally instead of pulling, see Dockerfile.local
# and the README.

services:
  syncribullet:
    image: ghcr.io/khiven/syncribullet:main
    container_name: syncribullet
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SYNCRIBULLET_PORT:-3050}:3000"
    environment:
      PRIVATE_ENCRYPTION_KEY: ${PRIVATE_ENCRYPTION_KEY}
      ORIGIN: ${ORIGIN}
      # Optional: NOTIFY_WEBHOOK_URL receives a POST when the TV Time
      # refresh token dies and the user must re-configure the addon.
      # NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL}
      # Optional: AXIOS_CACHE_DEBUG=1 floods stdout with cache events
      # (only enable when actively diagnosing — breaks log greppability).
      # AXIOS_CACHE_DEBUG: "0"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        compress: "true"
